spring.application.name=atelie-api

# Porta da API (o app vai chamar http://10.0.2.2:8080)
server.port=8080
# Devolve a mensagem de erro no JSON (ex.: "Este e-mail já está cadastrado")
server.error.include-message=always

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:3000/Atelie
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Upload de fotos das obras (o padrão do Spring é só 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB